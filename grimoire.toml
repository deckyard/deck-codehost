# Grimoire book configuration for the @deckyard/codehost documentation.

[book]
title = "@deckyard/codehost"
description = "One API over GitHub, GitLab and Forgejo: repositories, issues, pull and merge requests, releases, branches, tags, files and commit statuses"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "meridian"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-codehost/"
repoUrl = "https://github.com/deckyard/deck-codehost"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-codehost/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
